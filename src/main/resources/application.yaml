server:
  port: 9090

spring:
  application:
    name: flare-todo
  profiles:
    active: local
  servlet:
    multipart:
      # 업로드 요청 자체의 상한. 실제 첨부 1개당 최대 크기는 DB(app_settings: attachment.max-file-size)에서 관리
      max-file-size: 1GB
      max-request-size: 1GB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        show_sql: false
        jdbc:
          time_zone: UTC
  datasource:
    url: URL
    username: USERNAME
    password: PASSWORD
    driver-class-name: DRIVERCLASSNAME

jwt:
  # 필수. 32바이트 이상의 무작위 문자열 (예: openssl rand -base64 48). 비어 있으면 기동하지 않는다.
  secret: ${JWT_SECRET:}
  expiration: 86400000  # 24시간 (ms)

# MCP 서버 (Streamable HTTP, POST/GET /mcp). 인증은 Authorization: Bearer <API 토큰 ft_...> (SecurityConfig)
spring.ai.mcp.server:
  name: flare-todo
  version: 0.0.1
  type: SYNC
  protocol: STREAMABLE
  instructions: "Flare Todo 의 할 일·카테고리를 읽고 관리하는 도구. 사용자는 Bearer API 토큰으로 식별된다."
  capabilities:
    tool: true
    resource: false
    prompt: false
    completion: false
  streamable-http:
    mcp-endpoint: /mcp
    keep-alive-interval: 30s


# 첨부파일: S3 저장 + CloudFront(서명 쿠키)로 제공
app:
  attachment:
    bucket: flare-todo-attach
    region: ap-northeast-2
    cdn-base-url: ${CDN_BASE_URL:https://todo-att.flare.im}
    key-pair-id: K1RXDCTB6J2Z4D                 # CloudFront 공개키 ID (flare-todo-att-key-1)
    private-key-path: ${CDN_PRIVATE_KEY_PATH:}   # CloudFront 서명용 개인키(PKCS#8 PEM). 비우면 서명 쿠키 미발급
    cookie-domain: flare.im                     # todo.flare.im 과 todo-att.flare.im 이 공유하는 상위 도메인
    cookie-secure: true
    cookie-ttl: 12h
    orphan-retention: 1d
    share-base-url: ${SHARE_BASE_URL:https://todo.flare.im}
    share-redirect-ttl: 5m
    share-max-days: 365
    # S3 직접 공유 링크(최대 7일)용 장기 자격증명. 비우면 기본 체인(인스턴스 역할 = 임시 자격증명이라 링크가 수 시간 뒤 끊김)
    presign-access-key-id: ${S3_PRESIGN_ACCESS_KEY_ID:}
    presign-secret-access-key: ${S3_PRESIGN_SECRET_ACCESS_KEY:}
