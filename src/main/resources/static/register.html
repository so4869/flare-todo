<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - Flare Todo</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .register-card { max-width: 26.25rem; margin: 60px auto; }
    /* 고해상도(2K/4K): OS 배율 없이 쓰는 큰 화면에서 rem 기준 크기를 키워 UI 전체를 비례 확대 */
    @media (min-width: 2400px) and (min-height: 1300px) { html { font-size: 18px; } }
    @media (min-width: 3200px) and (min-height: 1800px) { html { font-size: 24px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="register-card card shadow-sm">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4 fw-bold text-primary">Flare Todo</h3>
      <p class="text-center text-muted mb-4">회원가입</p>
      <div id="alertBox" class="alert d-none"></div>
      <form id="registerForm">
        <div class="mb-3">
          <label class="form-label">아이디</label>
          <input type="text" id="username" class="form-control" placeholder="영문/숫자 3~20자" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">이메일</label>
          <input type="email" id="email" class="form-control" placeholder="이메일 주소" required>
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호</label>
          <input type="password" id="password" class="form-control" placeholder="8자 이상" required>
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호 확인</label>
          <input type="password" id="passwordConfirm" class="form-control" placeholder="비밀번호 재입력" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">회원가입</button>
      </form>
      <hr>
      <p class="text-center mb-0 small">이미 계정이 있으신가요? <a href="/login.html">로그인</a></p>
    </div>
  </div>
</div>
<script>
  (async () => {
    const token = localStorage.getItem('jwt_token');
    if (!token) return;
    const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.ok) location.href = '/index.html';
  })();

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    alertBox.className = 'alert d-none';

    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;
    if (password !== passwordConfirm) {
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = '비밀번호가 일치하지 않습니다.';
      return;
    }

    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password
      })
    });
    const data = await res.json();
    if (data.success) {
      alertBox.className = 'alert alert-success';
      alertBox.textContent = '회원가입 완료! 로그인 페이지로 이동합니다.';
      setTimeout(() => location.href = '/login.html', 1200);
    } else {
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = data.message;
    }
  });
</script>
</body>
</html>
