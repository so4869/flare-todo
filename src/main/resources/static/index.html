<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flare Todo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .sidebar { min-height: calc(100vh - 56px); background: #fff; border-right: 1px solid #dee2e6; }
    .category-item { cursor: pointer; border-radius: 6px; padding: 6px 10px; margin-bottom: 2px; transition: background .15s; }
    .category-item:hover { background: #f0f2f5; }
    .category-item.active { background: #e7f1ff; color: #0d6efd; font-weight: 500; }
    .todo-item { background: #fff; border: 1px solid #e9ecef; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; transition: box-shadow .15s; }
    .todo-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .todo-title { font-weight: 500; cursor: pointer; text-decoration: none; color: #212529; }
    .todo-title:hover { color: #0d6efd; }
    .todo-title.completed-text { text-decoration: line-through; color: #adb5bd; }
    .todo-checkbox { width: 20px; height: 20px; cursor: pointer; }
    .empty-state { text-align: center; padding: 60px 20px; color: #adb5bd; }
    .drag-handle { cursor: grab; color: #adb5bd; }
    .drag-handle:active { cursor: grabbing; }
    .category-item.drag-over { background: #cfe2ff !important; border: 1px dashed #0d6efd; }
    .category-item.dragging { opacity: .4; }
    .body-content { min-height: 60px; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px; background: #fff; }
    .body-content img { max-width: 100%; }
    #sidebarToggle { display: none; }
    @media (max-width: 768px) {
      #sidebarToggle { display: inline-block; }
      .sidebar { position: fixed; z-index: 1000; height: 100vh; top: 0; left: -100%; transition: left .25s; width: 260px !important; }
      .sidebar.show { left: 0; }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold">Flare Todo</span>
    <button id="sidebarToggle" class="btn btn-outline-light btn-sm me-2" onclick="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span class="text-white small" id="usernameLabel"></span>
      <button class="btn btn-outline-light btn-sm" onclick="openTzModal()" title="시간대 설정">
        <i class="bi bi-clock me-1"></i><span id="tzLabel">Asia/Seoul</span>
      </button>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">로그아웃</button>
    </div>
  </div>
</nav>

<div class="container-fluid p-0">
  <div class="row g-0">

    <!-- Sidebar -->
    <div class="col-12 col-md-2 sidebar p-3" id="sidebar">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="fw-semibold text-muted small">카테고리</span>
        <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#categoryModal">
          <i class="bi bi-plus"></i>
        </button>
      </div>
      <div class="category-item d-flex align-items-center gap-2" id="cat-all" onclick="clearCategoryFilter()">
        <i class="bi bi-list-task"></i><span>전체</span>
      </div>
      <div id="categoryList"></div>
    </div>

    <!-- Main content -->
    <div class="col-12 col-md-10 p-4">
      <!-- Filter tabs + Sort + Add button -->
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <ul class="nav nav-pills mb-0" id="filterTabs">
            <li class="nav-item">
              <a class="nav-link active" href="#" onclick="selectFilter('all', this)">전체</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="selectFilter('active', this)">미완료</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="selectFilter('completed', this)">완료</a>
            </li>
          </ul>
          <select id="sortSelect" class="form-select form-select-sm" style="width:auto"
                  onchange="selectSort(this.value)">
            <option value="createdAt_desc">생성일 최신순</option>
            <option value="createdAt_asc">생성일 오래된순</option>
            <option value="completedAt_desc">완료일 최신순</option>
            <option value="completedAt_asc">완료일 오래된순</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="openTodoModal()">
          <i class="bi bi-plus-lg me-1"></i>새 할 일
        </button>
      </div>

      <!-- Date range filter -->
      <div class="card card-body py-2 px-3 mb-3 bg-light border">
        <div class="row g-2 align-items-center flex-wrap">
          <div class="col-auto"><small class="text-muted fw-semibold">생성일</small></div>
          <div class="col-auto"><input type="date" id="createdFrom" class="form-control form-control-sm"></div>
          <div class="col-auto text-muted">~</div>
          <div class="col-auto"><input type="date" id="createdTo" class="form-control form-control-sm"></div>
          <div class="col-auto ms-3"><small class="text-muted fw-semibold">완료일</small></div>
          <div class="col-auto"><input type="date" id="completedFrom" class="form-control form-control-sm"></div>
          <div class="col-auto text-muted">~</div>
          <div class="col-auto"><input type="date" id="completedTo" class="form-control form-control-sm"></div>
          <div class="col-auto ms-2">
            <button class="btn btn-sm btn-primary" onclick="applyDateFilter()">검색</button>
            <button class="btn btn-sm btn-outline-secondary ms-1" onclick="resetDateFilter()">초기화</button>
          </div>
        </div>
      </div>

      <!-- Selected category badge -->
      <div id="categoryBadgeArea" class="mb-3"></div>

      <!-- Todo count -->
      <p class="text-muted small mb-2" id="todoCount"></p>

      <!-- Todo list -->
      <div id="todoList"></div>
    </div>
  </div>
</div>

<!-- Category Add Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">카테고리 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="catAlertBox" class="alert d-none"></div>
        <input type="text" id="categoryName" class="form-control" placeholder="카테고리 이름" maxlength="50">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button>
        <button class="btn btn-primary btn-sm" onclick="addCategory()">추가</button>
      </div>
    </div>
  </div>
</div>

<!-- Todo Add/Edit Modal -->
<div class="modal fade" id="todoModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="todoModalTitle">새 할 일</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="todoAlertBox" class="alert d-none"></div>
        <div class="mb-3">
          <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
          <input type="text" id="todoTitle" class="form-control" placeholder="할 일 제목" maxlength="200">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">카테고리 <small class="text-muted fw-normal">(복수 선택 가능)</small></label>
          <div class="border rounded p-2" style="max-height:120px;overflow-y:auto" id="categoryCheckboxes">
            <span class="text-muted small">카테고리가 없습니다.</span>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">본문</label>
          <textarea id="todoBody"></textarea>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="todoCompleted">
          <label class="form-check-label" for="todoCompleted">완료 처리</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button class="btn btn-primary" id="saveTodoBtn" onclick="saveTodo()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal fade" id="detailModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-truncate pe-3" id="detailModalTitle">할 일 상세</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="detailLoading" class="text-center py-4 text-muted">불러오는 중...</div>

        <!-- View mode -->
        <div id="detailViewMode" class="d-none">
          <h4 id="detailViewTitle" class="mb-3"></h4>
          <div class="d-flex flex-wrap gap-2 mb-3" id="detailViewBadges"></div>
          <div class="text-muted small mb-3">
            <i class="bi bi-clock me-1"></i>등록: <span id="detailViewCreatedAt"></span>
            &nbsp;|&nbsp;
            <i class="bi bi-pencil-square me-1"></i>수정: <span id="detailViewUpdatedAt"></span>
            <span id="detailViewCompletedAtArea">&nbsp;|&nbsp;<i class="bi bi-check-circle me-1 text-success"></i>완료: <span id="detailViewCompletedAt"></span></span>
          </div>
          <hr>
          <div class="body-content" id="detailViewBody"></div>
        </div>

        <!-- Edit mode -->
        <div id="detailEditMode" class="d-none">
          <div id="detailEditAlertBox" class="alert d-none"></div>
          <div class="mb-3">
            <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
            <input type="text" id="detailEditTitle" class="form-control" maxlength="200">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">카테고리 <small class="text-muted fw-normal">(복수 선택 가능)</small></label>
            <div class="border rounded p-2" style="max-height:120px;overflow-y:auto" id="detailEditCategoryCheckboxes">
              <span class="text-muted small">카테고리가 없습니다.</span>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">본문</label>
            <textarea id="detailEditBody"></textarea>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="detailEditCompleted">
            <label class="form-check-label" for="detailEditCompleted">완료 처리</label>
          </div>
        </div>
      </div>

      <div class="modal-footer" id="detailViewFooter">
        <button class="btn btn-outline-danger btn-sm me-auto" onclick="deleteDetailTodo()">
          <i class="bi bi-trash me-1"></i>삭제
        </button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        <button class="btn btn-outline-primary" onclick="enterDetailEditMode()">
          <i class="bi bi-pencil me-1"></i>수정
        </button>
      </div>
      <div class="modal-footer d-none" id="detailEditFooter">
        <button class="btn btn-outline-secondary" onclick="exitDetailEditMode()">취소</button>
        <button class="btn btn-primary" onclick="saveDetailEdit()">
          <i class="bi bi-check-lg me-1"></i>저장
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Timezone Modal -->
<div class="modal fade" id="tzModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title"><i class="bi bi-clock me-2"></i>시간대 설정</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <select id="tzSelect" class="form-select form-select-sm">
          <option value="UTC">UTC (UTC+0)</option>
          <option value="Asia/Seoul">Asia/Seoul (KST, UTC+9)</option>
          <option value="Asia/Tokyo">Asia/Tokyo (JST, UTC+9)</option>
          <option value="Asia/Shanghai">Asia/Shanghai (CST, UTC+8)</option>
          <option value="Asia/Singapore">Asia/Singapore (SGT, UTC+8)</option>
          <option value="Asia/Kolkata">Asia/Kolkata (IST, UTC+5:30)</option>
          <option value="Europe/London">Europe/London (GMT/BST)</option>
          <option value="Europe/Paris">Europe/Paris (CET/CEST)</option>
          <option value="Europe/Berlin">Europe/Berlin (CET/CEST)</option>
          <option value="America/New_York">America/New_York (EST/EDT)</option>
          <option value="America/Chicago">America/Chicago (CST/CDT)</option>
          <option value="America/Los_Angeles">America/Los_Angeles (PST/PDT)</option>
          <option value="America/Sao_Paulo">America/Sao_Paulo (BRT)</option>
          <option value="Australia/Sydney">Australia/Sydney (AEST/AEDT)</option>
          <option value="Pacific/Auckland">Pacific/Auckland (NZST/NZDT)</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">취소</button>
        <button class="btn btn-primary btn-sm" onclick="saveTz()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar overlay (mobile) -->
<div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;" onclick="toggleSidebar()"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/tinymce/tinymce.min.js"></script>
<script>
  async function authFetch(url, options = {}) {
    const token = localStorage.getItem('jwt_token');
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) {
      localStorage.removeItem('jwt_token');
      location.href = '/login.html';
      return null;
    }
    return res;
  }

  let userTimezone = 'Asia/Seoul';

  let currentFilter = 'all';
  let selectedCategoryIds = [];
  let editingTodoId = null;
  let pendingEditorContent = '';
  let categories = [];
  let dateFilters = { createdFrom: '', createdTo: '', completedFrom: '', completedTo: '' };
  let currentSort = 'createdAt_desc';

  const SEARCH_STATE_KEY = 'flare_todo_search';

  function saveSearchState() {
    localStorage.setItem(SEARCH_STATE_KEY, JSON.stringify({
      filter: currentFilter,
      categoryIds: selectedCategoryIds,
      sort: currentSort,
      dateFilters
    }));
  }

  function loadSearchState() {
    try {
      const s = JSON.parse(localStorage.getItem(SEARCH_STATE_KEY) || '{}');
      if (s.filter)      currentFilter      = s.filter;
      if (s.categoryIds) selectedCategoryIds = s.categoryIds;
      if (s.sort)        currentSort        = s.sort;
      if (s.dateFilters) dateFilters        = { ...dateFilters, ...s.dateFilters };
    } catch (_) {}
  }

  function restoreSearchUI() {
    // 필터 탭
    const filterIdx = { all: 0, active: 1, completed: 2 };
    const tabs = document.querySelectorAll('#filterTabs .nav-link');
    tabs.forEach(a => a.classList.remove('active'));
    tabs[filterIdx[currentFilter] ?? 0]?.classList.add('active');
    // 정렬
    document.getElementById('sortSelect').value = currentSort;
    // 날짜 필터 입력값
    document.getElementById('createdFrom').value   = dateFilters.createdFrom;
    document.getElementById('createdTo').value     = dateFilters.createdTo;
    document.getElementById('completedFrom').value = dateFilters.completedFrom;
    document.getElementById('completedTo').value   = dateFilters.completedTo;
  }

  // ── Auth check ─────────────────────────────────────────────
  (async () => {
    if (!localStorage.getItem('jwt_token')) { location.href = '/login.html'; return; }
    const res = await authFetch('/api/auth/me');
    if (!res) return;
    const data = await res.json();
    userTimezone = data.data.timezone || 'Asia/Seoul';
    document.getElementById('usernameLabel').textContent = data.data.username + '님';
    document.getElementById('tzLabel').textContent = userTimezone;
    loadSearchState();
    await loadCategories();
    // 삭제된 카테고리 ID는 필터에서 제거
    selectedCategoryIds = selectedCategoryIds.filter(id => categories.some(c => c.id === id));
    restoreSearchUI();
    updateCategoryBadge();
    await loadTodos();
  })();

  async function logout() {
    await authFetch('/api/auth/logout', { method: 'POST' });
    localStorage.removeItem('jwt_token');
    location.href = '/login.html';
  }

  // ── Categories ─────────────────────────────────────────────
  async function loadCategories() {
    const res = await authFetch('/api/categories');
    const data = await res.json();
    categories = data.data || [];
    renderCategories();
  }

  function renderCategories() {
    document.getElementById('cat-all').classList.toggle('active', selectedCategoryIds.length === 0);

    document.getElementById('categoryList').innerHTML = categories.map(c => `
      <div class="category-item d-flex justify-content-between align-items-center"
           id="cat-${c.id}"
           draggable="true"
           ondragstart="catDragStart(event,${c.id})"
           ondragover="catDragOver(event)"
           ondragleave="catDragLeave(event)"
           ondrop="catDrop(event,${c.id})"
           ondragend="catDragEnd(event)"
           onclick="toggleCategory(${c.id})">
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-grip-vertical drag-handle" onclick="event.stopPropagation()"></i>
          <input type="checkbox" class="form-check-input" id="catFilter_${c.id}"
                 ${selectedCategoryIds.includes(c.id) ? 'checked' : ''}
                 onclick="event.stopPropagation(); toggleCategory(${c.id})">
          <label class="mb-0" for="catFilter_${c.id}">
            <i class="bi bi-tag me-1"></i>${escHtml(c.name)}
          </label>
        </div>
        <button class="btn btn-sm btn-link text-danger p-0 ms-1" onclick="deleteCategory(event,${c.id})">
          <i class="bi bi-x-lg" style="font-size:.75rem"></i>
        </button>
      </div>`).join('');
  }

  // ── Category drag-and-drop ─────────────────────────────────
  let catDraggingId = null;

  function catDragStart(e, id) {
    catDraggingId = id;
    e.dataTransfer.effectAllowed = 'move';
    // setTimeout으로 렌더 후 적용 (없으면 드래그 미리보기 이미지도 흐려짐)
    setTimeout(() => document.getElementById(`cat-${id}`)?.classList.add('dragging'), 0);
  }

  function catDragEnd(e) {
    if (catDraggingId) document.getElementById(`cat-${catDraggingId}`)?.classList.remove('dragging');
    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('drag-over'));
    catDraggingId = null;
  }

  function catDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    e.currentTarget.classList.add('drag-over');
  }

  function catDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }

  async function catDrop(e, targetId) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    if (!catDraggingId || catDraggingId === targetId) return;

    const fromIdx = categories.findIndex(c => c.id === catDraggingId);
    const toIdx   = categories.findIndex(c => c.id === targetId);
    if (fromIdx === -1 || toIdx === -1) return;

    categories.splice(toIdx, 0, categories.splice(fromIdx, 1)[0]);
    renderCategories();

    const res = await authFetch('/api/categories/order', {
      method: 'PUT',
      body: JSON.stringify({ categoryIds: categories.map(c => c.id) })
    });
    if (res && !res.ok) await loadCategories(); // 실패 시 서버 상태로 복원
  }

  function toggleCategory(id) {
    const idx = selectedCategoryIds.indexOf(id);
    if (idx === -1) selectedCategoryIds.push(id);
    else selectedCategoryIds.splice(idx, 1);
    saveSearchState();
    renderCategories();
    updateCategoryBadge();
    loadTodos();
  }

  function clearCategoryFilter() {
    selectedCategoryIds = [];
    saveSearchState();
    renderCategories();
    updateCategoryBadge();
    loadTodos();
  }

  function updateCategoryBadge() {
    const badge = document.getElementById('categoryBadgeArea');
    if (!selectedCategoryIds.length) { badge.innerHTML = ''; return; }
    badge.innerHTML = selectedCategoryIds.map(id => {
      const cat = categories.find(c => c.id === id);
      return cat ? `<span class="badge bg-primary-subtle text-primary border border-primary-subtle me-1 mb-1">
        <i class="bi bi-tag me-1"></i>${escHtml(cat.name)}
        <i class="bi bi-x ms-1" style="cursor:pointer" onclick="toggleCategory(${id})"></i>
      </span>` : '';
    }).join('');
  }

  function populateCategorySelect(selectedIds = []) {
    const container = document.getElementById('categoryCheckboxes');
    if (!categories.length) {
      container.innerHTML = '<span class="text-muted small">카테고리가 없습니다.</span>';
      return;
    }
    container.innerHTML = categories.map(c => `
      <div class="form-check">
        <input class="form-check-input" type="checkbox" value="${c.id}" id="catChk_${c.id}"
               ${selectedIds.includes(c.id) ? 'checked' : ''}>
        <label class="form-check-label small" for="catChk_${c.id}">${escHtml(c.name)}</label>
      </div>`).join('');
  }

  function getSelectedCategoryIds() {
    return Array.from(document.querySelectorAll('#categoryCheckboxes input:checked'))
      .map(cb => Number(cb.value));
  }

  async function addCategory() {
    const name = document.getElementById('categoryName').value.trim();
    const box = document.getElementById('catAlertBox');
    if (!name) { showAlert(box, 'danger', '카테고리 이름을 입력하세요.'); return; }
    const res = await authFetch('/api/categories', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('categoryName').value = '';
      bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
      await loadCategories();
    } else {
      showAlert(box, 'danger', data.message);
    }
  }

  async function deleteCategory(e, id) {
    e.stopPropagation();
    if (!confirm('카테고리를 삭제하면 해당 할 일의 카테고리가 해제됩니다. 삭제하시겠습니까?')) return;
    const res = await authFetch(`/api/categories/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      const idx = selectedCategoryIds.indexOf(id);
      if (idx !== -1) selectedCategoryIds.splice(idx, 1);
      saveSearchState();
      await loadCategories();
      updateCategoryBadge();
      await loadTodos();
    }
  }

  function selectFilter(filter, el) {
    currentFilter = filter;
    document.querySelectorAll('#filterTabs .nav-link').forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    saveSearchState();
    loadTodos();
  }

  // ── Todos ──────────────────────────────────────────────────
  function selectSort(value) {
    currentSort = value;
    saveSearchState();
    loadTodos();
  }

  async function loadTodos() {
    const [sortBy, sortDir] = currentSort.split('_');
    const params = new URLSearchParams({ filter: currentFilter, sortBy, sortDir });
    selectedCategoryIds.forEach(id => params.append('categoryIds', id));
    if (dateFilters.createdFrom)   params.set('createdFrom',    dateFilters.createdFrom);
    if (dateFilters.createdTo)     params.set('createdTo',      dateFilters.createdTo);
    if (dateFilters.completedFrom) params.set('completedFrom',  dateFilters.completedFrom);
    if (dateFilters.completedTo)   params.set('completedTo',    dateFilters.completedTo);
    const res = await authFetch(`/api/todos?${params}`);
    const data = await res.json();
    renderTodos(data.data || []);
  }

  function applyDateFilter() {
    dateFilters.createdFrom   = document.getElementById('createdFrom').value;
    dateFilters.createdTo     = document.getElementById('createdTo').value;
    dateFilters.completedFrom = document.getElementById('completedFrom').value;
    dateFilters.completedTo   = document.getElementById('completedTo').value;
    saveSearchState();
    loadTodos();
  }

  function resetDateFilter() {
    dateFilters = { createdFrom: '', createdTo: '', completedFrom: '', completedTo: '' };
    ['createdFrom','createdTo','completedFrom','completedTo'].forEach(id => {
      document.getElementById(id).value = '';
    });
    saveSearchState();
    loadTodos();
  }

  function renderTodos(todos) {
    const container = document.getElementById('todoList');
    const count = document.getElementById('todoCount');
    count.textContent = `총 ${todos.length}건`;
    if (!todos.length) {
      container.innerHTML = `<div class="empty-state">
        <i class="bi bi-inbox" style="font-size:2.5rem"></i>
        <p class="mt-2">할 일이 없습니다.</p></div>`;
      return;
    }
    container.innerHTML = todos.map(t => `
      <div class="todo-item">
        <div class="d-flex align-items-start gap-3">
          <input type="checkbox" class="todo-checkbox form-check-input mt-1" ${t.completed ? 'checked' : ''}
            onchange="toggleTodo(${t.id})" title="완료 토글">
          <div class="flex-grow-1 min-width-0">
            <span class="todo-title ${t.completed ? 'completed-text' : ''}" onclick="openDetailModal(${t.id})">
              ${escHtml(t.title)}
            </span>
            <div class="d-flex flex-wrap gap-2 mt-1 align-items-center">
              ${(t.categories || []).map(c => `<span class="badge bg-primary-subtle text-primary border border-primary-subtle">
                <i class="bi bi-tag me-1"></i>${escHtml(c.name)}</span>`).join('')}
              ${t.completed
                ? '<span class="badge bg-success-subtle text-success border border-success-subtle">완료</span>'
                : '<span class="badge bg-warning-subtle text-warning border border-warning-subtle">미완료</span>'}
              <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i>${fmtDate(t.createdAt)}</span>
              ${t.completedAt ? `<span class="text-muted small"><i class="bi bi-check-circle me-1 text-success"></i>${fmtDate(t.completedAt)}</span>` : ''}
            </div>
          </div>
          <div class="d-flex gap-1 flex-shrink-0">
            <button class="btn btn-sm btn-outline-secondary" onclick="openEditTodoModal(${t.id})" title="수정">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteTodo(${t.id})" title="삭제">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>
      </div>`).join('');
  }

  async function toggleTodo(id) {
    const res = await authFetch(`/api/todos/${id}/toggle`, { method: 'PATCH' });
    const data = await res.json();
    if (data.success) await loadTodos();
  }

  async function deleteTodo(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const res = await authFetch(`/api/todos/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) await loadTodos();
  }

  // ── Todo Modal ─────────────────────────────────────────────
  const todoModal = document.getElementById('todoModal');

  todoModal.addEventListener('shown.bs.modal', () => {
    tinymce.init({
      selector: '#todoBody',
      base_url: '/tinymce',
      suffix: '.min',
      height: 320,
      plugins: 'anchor autolink lists link image charmap preview searchreplace visualblocks code fullscreen table',
      toolbar: 'undo redo | formatselect | bold italic underline strikethrough | forecolor backcolor | alignleft aligncenter alignright | bullist numlist | link | removeformat | code',
      menubar: false,
      branding: false,
      setup(editor) {
        editor.on('init', () => {
          if (pendingEditorContent !== undefined) {
            editor.setContent(pendingEditorContent);
          }
        });
      }
    });
  });

  todoModal.addEventListener('hide.bs.modal', () => {
    if (tinymce.get('todoBody')) tinymce.remove('#todoBody');
  });

  function openTodoModal() {
    editingTodoId = null;
    pendingEditorContent = '';
    document.getElementById('todoModalTitle').textContent = '새 할 일';
    document.getElementById('todoTitle').value = '';
    document.getElementById('todoCompleted').checked = false;
    document.getElementById('todoAlertBox').className = 'alert d-none';
    populateCategorySelect([...selectedCategoryIds]);
    new bootstrap.Modal(todoModal).show();
  }

  async function openEditTodoModal(id) {
    const res = await authFetch(`/api/todos/${id}`);
    const data = await res.json();
    if (!data.success) return;
    const t = data.data;
    editingTodoId = id;
    pendingEditorContent = t.body || '';
    document.getElementById('todoModalTitle').textContent = '할 일 수정';
    document.getElementById('todoTitle').value = t.title;
    document.getElementById('todoCompleted').checked = t.completed;
    document.getElementById('todoAlertBox').className = 'alert d-none';
    populateCategorySelect((t.categories || []).map(c => c.id));
    new bootstrap.Modal(todoModal).show();
  }

  async function saveTodo() {
    const box = document.getElementById('todoAlertBox');
    const title = document.getElementById('todoTitle').value.trim();
    if (!title) { showAlert(box, 'danger', '제목을 입력하세요.'); return; }

    const editor = tinymce.get('todoBody');
    const body = editor ? editor.getContent() : '';
    const categoryIds = getSelectedCategoryIds();
    const completed = document.getElementById('todoCompleted').checked;

    const payload = { title, body, categoryIds, completed };
    const url = editingTodoId ? `/api/todos/${editingTodoId}` : '/api/todos';
    const method = editingTodoId ? 'PUT' : 'POST';

    const res = await authFetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.success) {
      bootstrap.Modal.getInstance(todoModal).hide();
      await loadTodos();
    } else {
      showAlert(box, 'danger', data.message);
    }
  }

  // ── Detail Modal ───────────────────────────────────────────
  let detailTodoId = null;
  let detailCurrentTodo = null;

  const detailModal = document.getElementById('detailModal');

  detailModal.addEventListener('hide.bs.modal', () => {
    if (tinymce.get('detailEditBody')) tinymce.remove('#detailEditBody');
  });

  async function openDetailModal(id) {
    detailTodoId = id;
    detailCurrentTodo = null;
    document.getElementById('detailLoading').classList.remove('d-none');
    document.getElementById('detailViewMode').classList.add('d-none');
    document.getElementById('detailEditMode').classList.add('d-none');
    document.getElementById('detailViewFooter').classList.remove('d-none');
    document.getElementById('detailEditFooter').classList.add('d-none');
    document.getElementById('detailModalTitle').textContent = '할 일 상세';
    new bootstrap.Modal(detailModal).show();

    const res = await authFetch(`/api/todos/${id}`);
    if (!res) return;
    const data = await res.json();
    if (!data.success) return;
    detailCurrentTodo = data.data;
    document.getElementById('detailLoading').classList.add('d-none');
    renderDetailView();
    document.getElementById('detailViewMode').classList.remove('d-none');
  }

  function renderDetailView() {
    const t = detailCurrentTodo;
    document.getElementById('detailModalTitle').textContent = t.title;
    document.getElementById('detailViewTitle').textContent = t.title;
    document.getElementById('detailViewBody').innerHTML = t.body || '<span class="text-muted">본문 없음</span>';
    document.getElementById('detailViewCreatedAt').textContent = fmtDate(t.createdAt);
    document.getElementById('detailViewUpdatedAt').textContent = fmtDate(t.updatedAt);
    const completedArea = document.getElementById('detailViewCompletedAtArea');
    if (t.completedAt) {
      document.getElementById('detailViewCompletedAt').textContent = fmtDate(t.completedAt);
      completedArea.style.display = '';
    } else {
      completedArea.style.display = 'none';
    }
    const badges = document.getElementById('detailViewBadges');
    badges.innerHTML = (t.categories || []).map(c =>
      `<span class="badge bg-primary-subtle text-primary border border-primary-subtle">
        <i class="bi bi-tag me-1"></i>${escHtml(c.name)}</span>`).join('');
    badges.innerHTML += t.completed
      ? '<span class="badge bg-success-subtle text-success border border-success-subtle"><i class="bi bi-check-circle me-1"></i>완료</span>'
      : '<span class="badge bg-warning-subtle text-warning border border-warning-subtle"><i class="bi bi-circle me-1"></i>미완료</span>';
  }

  function enterDetailEditMode() {
    const t = detailCurrentTodo;
    document.getElementById('detailEditTitle').value = t.title;
    document.getElementById('detailEditCompleted').checked = t.completed;
    document.getElementById('detailEditAlertBox').className = 'alert d-none';
    const selectedIds = (t.categories || []).map(c => c.id);
    const container = document.getElementById('detailEditCategoryCheckboxes');
    if (!categories.length) {
      container.innerHTML = '<span class="text-muted small">카테고리가 없습니다.</span>';
    } else {
      container.innerHTML = categories.map(c => `
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="${c.id}" id="deCatChk_${c.id}"
                 ${selectedIds.includes(c.id) ? 'checked' : ''}>
          <label class="form-check-label small" for="deCatChk_${c.id}">${escHtml(c.name)}</label>
        </div>`).join('');
    }
    document.getElementById('detailViewMode').classList.add('d-none');
    document.getElementById('detailEditMode').classList.remove('d-none');
    document.getElementById('detailViewFooter').classList.add('d-none');
    document.getElementById('detailEditFooter').classList.remove('d-none');
    tinymce.init({
      selector: '#detailEditBody',
      base_url: '/tinymce',
      suffix: '.min',
      height: 320,
      plugins: 'anchor autolink lists link image charmap preview searchreplace visualblocks code fullscreen table',
      toolbar: 'undo redo | formatselect | bold italic underline strikethrough | forecolor backcolor | alignleft aligncenter alignright | bullist numlist | link | removeformat | code',
      menubar: false,
      branding: false,
      setup(editor) {
        editor.on('init', () => editor.setContent(t.body || ''));
      }
    });
  }

  function exitDetailEditMode() {
    if (tinymce.get('detailEditBody')) tinymce.remove('#detailEditBody');
    document.getElementById('detailEditMode').classList.add('d-none');
    document.getElementById('detailViewMode').classList.remove('d-none');
    document.getElementById('detailEditFooter').classList.add('d-none');
    document.getElementById('detailViewFooter').classList.remove('d-none');
  }

  async function saveDetailEdit() {
    const box = document.getElementById('detailEditAlertBox');
    const title = document.getElementById('detailEditTitle').value.trim();
    if (!title) { showAlert(box, 'danger', '제목을 입력하세요.'); return; }
    const editor = tinymce.get('detailEditBody');
    const body = editor ? editor.getContent() : '';
    const categoryIds = Array.from(document.querySelectorAll('#detailEditCategoryCheckboxes input:checked'))
      .map(cb => Number(cb.value));
    const completed = document.getElementById('detailEditCompleted').checked;
    const res = await authFetch(`/api/todos/${detailTodoId}`, {
      method: 'PUT',
      body: JSON.stringify({ title, body, categoryIds, completed })
    });
    const data = await res.json();
    if (data.success) {
      detailCurrentTodo = data.data;
      exitDetailEditMode();
      renderDetailView();
      await loadTodos();
    } else {
      showAlert(box, 'danger', data.message);
    }
  }

  async function deleteDetailTodo() {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const res = await authFetch(`/api/todos/${detailTodoId}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      bootstrap.Modal.getInstance(detailModal).hide();
      await loadTodos();
    }
  }

  // ── Helpers ────────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function openTzModal() {
    document.getElementById('tzSelect').value = userTimezone;
    new bootstrap.Modal(document.getElementById('tzModal')).show();
  }

  async function saveTz() {
    const tz = document.getElementById('tzSelect').value;
    const res = await authFetch('/api/users/timezone', {
      method: 'PUT',
      body: JSON.stringify({ timezone: tz })
    });
    if (!res) return;
    const data = await res.json();
    if (data.success) {
      userTimezone = tz;
      document.getElementById('tzLabel').textContent = tz;
      bootstrap.Modal.getInstance(document.getElementById('tzModal')).hide();
      loadTodos();
    }
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const main = d.toLocaleString('ko-KR', {
      timeZone: userTimezone,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
    const tzAbbr = new Intl.DateTimeFormat('en', { timeZone: userTimezone, timeZoneName: 'short' })
      .formatToParts(d).find(p => p.type === 'timeZoneName')?.value ?? '';
    return tzAbbr ? `${main} (${tzAbbr})` : main;
  }

  function showAlert(el, type, msg) {
    el.className = `alert alert-${type}`;
    el.textContent = msg;
  }

  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebarOverlay');
    const open = sb.classList.toggle('show');
    ov.style.display = open ? 'block' : 'none';
  }

  // Enter key in category modal
  document.getElementById('categoryName').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCategory();
  });
</script>
</body>
</html>
