<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 상세 - Flare Todo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .detail-card { max-width: 860px; margin: 30px auto; }
    .body-content { min-height: 120px; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px; background: #fff; }
    .body-content img { max-width: 100%; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/index.html">Flare Todo</a>
    <div class="ms-auto d-flex gap-2">
      <span class="text-white small" id="usernameLabel"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">로그아웃</button>
    </div>
  </div>
</nav>

<div class="container detail-card">
  <div id="loadingMsg" class="text-center py-5 text-muted">불러오는 중...</div>
  <div id="detailView" class="d-none">

    <!-- View mode -->
    <div id="viewMode">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="/index.html" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>목록으로
        </a>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary btn-sm" onclick="enterEditMode()">
            <i class="bi bi-pencil me-1"></i>수정
          </button>
          <button class="btn btn-outline-danger btn-sm" onclick="deleteTodo()">
            <i class="bi bi-trash me-1"></i>삭제
          </button>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="card-title mb-3" id="viewTitle"></h2>
          <div class="d-flex flex-wrap gap-2 mb-4" id="viewBadges"></div>
          <div class="mb-2 text-muted small">
            <i class="bi bi-clock me-1"></i>등록: <span id="viewCreatedAt"></span>
            &nbsp;|&nbsp;
            <i class="bi bi-pencil-square me-1"></i>수정: <span id="viewUpdatedAt"></span>
            <span id="viewCompletedAtArea">&nbsp;|&nbsp;<i class="bi bi-check-circle me-1"></i>완료: <span id="viewCompletedAt"></span></span>
          </div>
          <hr>
          <div class="body-content" id="viewBody"></div>
        </div>
      </div>
    </div>

    <!-- Edit mode -->
    <div id="editMode" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button class="btn btn-outline-secondary btn-sm" onclick="exitEditMode()">
          <i class="bi bi-x-lg me-1"></i>취소
        </button>
        <button class="btn btn-primary btn-sm" onclick="saveEdit()">
          <i class="bi bi-check-lg me-1"></i>저장
        </button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div id="editAlertBox" class="alert d-none"></div>
          <div class="mb-3">
            <label class="form-label fw-semibold">제목</label>
            <input type="text" id="editTitle" class="form-control" maxlength="200">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">카테고리 <small class="text-muted fw-normal">(복수 선택 가능)</small></label>
            <div class="border rounded p-2" style="max-height:120px;overflow-y:auto" id="editCategoryCheckboxes">
              <span class="text-muted small">카테고리가 없습니다.</span>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">본문</label>
            <textarea id="editBody"></textarea>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="editCompleted">
            <label class="form-check-label" for="editCompleted">완료 처리</label>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/tinymce/tinymce.min.js"></script>
<script>
  async function authFetch(url, options = {}) {
    const token = localStorage.getItem('jwt_token');
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const res = await fetch(url, { ...options, headers });
    if (res.status === 401) {
      localStorage.removeItem('jwt_token');
      location.href = '/login.html';
      return null;
    }
    return res;
  }

  let userTimezone = 'Asia/Seoul';

  const todoId = new URLSearchParams(location.search).get('id');
  let currentTodo = null;
  let categories = [];

  // ── Init ───────────────────────────────────────────────────
  (async () => {
    if (!localStorage.getItem('jwt_token')) { location.href = '/login.html'; return; }
    const meRes = await authFetch('/api/auth/me');
    if (!meRes) return;
    if (!meRes.ok) { location.href = '/login.html'; return; }
    const me = await meRes.json();
    userTimezone = me.data.timezone || 'Asia/Seoul';
    document.getElementById('usernameLabel').textContent = me.data.username + '님';

    if (!todoId) { location.href = '/index.html'; return; }

    const [todoRes, catRes] = await Promise.all([
      authFetch(`/api/todos/${todoId}`),
      authFetch('/api/categories')
    ]);
    const todoData = await todoRes.json();
    const catData = await catRes.json();

    if (!todoData.success) { location.href = '/index.html'; return; }
    categories = catData.data || [];
    currentTodo = todoData.data;

    document.getElementById('loadingMsg').classList.add('d-none');
    document.getElementById('detailView').classList.remove('d-none');
    renderView();
  })();

  async function logout() {
    await authFetch('/api/auth/logout', { method: 'POST' });
    localStorage.removeItem('jwt_token');
    location.href = '/login.html';
  }

  // ── View Mode ──────────────────────────────────────────────
  function renderView() {
    const t = currentTodo;
    document.title = t.title + ' - Flare Todo';
    document.getElementById('viewTitle').textContent = t.title;
    document.getElementById('viewBody').innerHTML = t.body || '<span class="text-muted">본문 없음</span>';
    document.getElementById('viewCreatedAt').textContent = fmtDate(t.createdAt);
    document.getElementById('viewUpdatedAt').textContent = fmtDate(t.updatedAt);
    const completedArea = document.getElementById('viewCompletedAtArea');
    if (t.completedAt) {
      document.getElementById('viewCompletedAt').textContent = fmtDate(t.completedAt);
      completedArea.style.display = '';
    } else {
      completedArea.style.display = 'none';
    }

    const badges = document.getElementById('viewBadges');
    badges.innerHTML = (t.categories || []).map(c =>
      `<span class="badge bg-primary-subtle text-primary border border-primary-subtle fs-6">
        <i class="bi bi-tag me-1"></i>${escHtml(c.name)}</span>`).join('');
    badges.innerHTML += t.completed
      ? '<span class="badge bg-success-subtle text-success border border-success-subtle fs-6"><i class="bi bi-check-circle me-1"></i>완료</span>'
      : '<span class="badge bg-warning-subtle text-warning border border-warning-subtle fs-6"><i class="bi bi-circle me-1"></i>미완료</span>';
  }

  // ── Edit Mode ──────────────────────────────────────────────
  function enterEditMode() {
    const t = currentTodo;
    document.getElementById('editTitle').value = t.title;
    document.getElementById('editCompleted').checked = t.completed;
    document.getElementById('editAlertBox').className = 'alert d-none';

    const selectedIds = (t.categories || []).map(c => c.id);
    const container = document.getElementById('editCategoryCheckboxes');
    if (!categories.length) {
      container.innerHTML = '<span class="text-muted small">카테고리가 없습니다.</span>';
    } else {
      container.innerHTML = categories.map(c => `
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="${c.id}" id="eCatChk_${c.id}"
                 ${selectedIds.includes(c.id) ? 'checked' : ''}>
          <label class="form-check-label small" for="eCatChk_${c.id}">${escHtml(c.name)}</label>
        </div>`).join('');
    }

    document.getElementById('viewMode').classList.add('d-none');
    document.getElementById('editMode').classList.remove('d-none');

    tinymce.init({
      selector: '#editBody',
      base_url: '/tinymce',
      suffix: '.min',
      height: 400,
      plugins: 'anchor autolink lists link image charmap preview searchreplace visualblocks code fullscreen table',
      toolbar: 'undo redo | formatselect | bold italic underline strikethrough | forecolor backcolor | alignleft aligncenter alignright | bullist numlist | link | removeformat | code',
      menubar: false,
      branding: false,
      setup(editor) {
        editor.on('init', () => editor.setContent(t.body || ''));
      }
    });
  }

  function exitEditMode() {
    if (tinymce.get('editBody')) tinymce.remove('#editBody');
    document.getElementById('editMode').classList.add('d-none');
    document.getElementById('viewMode').classList.remove('d-none');
  }

  async function saveEdit() {
    const box = document.getElementById('editAlertBox');
    const title = document.getElementById('editTitle').value.trim();
    if (!title) { showAlert(box, 'danger', '제목을 입력하세요.'); return; }

    const editor = tinymce.get('editBody');
    const body = editor ? editor.getContent() : '';
    const categoryIds = Array.from(document.querySelectorAll('#editCategoryCheckboxes input:checked'))
      .map(cb => Number(cb.value));
    const completed = document.getElementById('editCompleted').checked;

    const res = await authFetch(`/api/todos/${todoId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        body,
        categoryIds,
        completed
      })
    });
    const data = await res.json();
    if (data.success) {
      currentTodo = data.data;
      exitEditMode();
      renderView();
    } else {
      showAlert(box, 'danger', data.message);
    }
  }

  async function deleteTodo() {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const res = await authFetch(`/api/todos/${todoId}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) location.href = '/index.html';
  }

  // ── Helpers ────────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const main = d.toLocaleString('ko-KR', {
      timeZone: userTimezone,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
    const tzAbbr = new Intl.DateTimeFormat('en', { timeZone: userTimezone, timeZoneName: 'short' })
      .formatToParts(d).find(p => p.type === 'timeZoneName')?.value ?? '';
    return tzAbbr ? `${main} (${tzAbbr})` : main;
  }

  function showAlert(el, type, msg) {
    el.className = `alert alert-${type}`;
    el.textContent = msg;
  }
</script>
</body>
</html>
