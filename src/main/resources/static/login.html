<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Flare Todo</title>
  <link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .login-card { max-width: 26.25rem; margin: 80px auto; }
    /* 고해상도(2K/4K): OS 배율 없이 쓰는 큰 화면에서 rem 기준 크기를 키워 UI 전체를 비례 확대 */
    @media (min-width: 2400px) and (min-height: 1300px) { html { font-size: 18px; } }
    @media (min-width: 3200px) and (min-height: 1800px) { html { font-size: 24px; } }
  </style>
</head>
<body>
<div class="container">
  <div class="login-card card shadow-sm">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4 fw-bold text-primary">Flare Todo</h3>
      <div id="alertBox" class="alert d-none"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">아이디</label>
          <input type="text" id="username" class="form-control" placeholder="아이디 입력" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호</label>
          <input type="password" id="password" class="form-control" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
      </form>
      <hr>
      <p class="text-center mb-0 small">계정이 없으신가요? <a href="/register.html">회원가입</a></p>
    </div>
  </div>
</div>
<script>
  (async () => {
    const token = localStorage.getItem('jwt_token');
    if (!token) return;
    const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.ok) location.href = '/index.html';
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    alertBox.className = 'alert d-none';

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('jwt_token', data.data.accessToken);
      location.href = '/index.html';
    } else {
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = data.message;
    }
  });
</script>
</body>
</html>
